# CD (Continuous Delivery): construye la imagen Docker y la publica en el
# registry. Se dispara solo cuando el push a main ya pasó por CI, así que
# lo que se publica siempre es código testeado.
#
# Registry: GHCR (ghcr.io), el registry de contenedores de GitHub. Lo
# elegimos sobre Docker Hub porque no requiere crear ni guardar ninguna
# credencial: GitHub le inyecta al workflow un GITHUB_TOKEN temporal con
# permiso para publicar en la cuenta dueña del repo (ver "permissions"
# abajo).
name: Publish

on:
  push:
    branches: [main]
  # workflow_dispatch permite dispararlo a mano desde la pestaña Actions,
  # útil para re-publicar sin tener que hacer un commit vacío.
  workflow_dispatch:

permissions:
  contents: read
  packages: write # necesario para poder hacer push a ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU emula otras arquitecturas de CPU dentro del runner (que es
      # x86). Sin esto no podríamos construir la variante arm64 desde acá.
      - name: Configurar QEMU (para compilar multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      # Buildx es el motor de build extendido de Docker: es el que sabe
      # generar una sola imagen con varias arquitecturas adentro.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action calcula los tags de la imagen. Publicamos dos:
      #   :latest -> siempre apunta al último main (es el que usa el cloud)
      #   :<sha>  -> inmutable, permite volver a una versión exacta
      # También pasa el nombre del repo a minúsculas, que es obligatorio
      # en los nombres de imagen de Docker.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # linux/amd64 para PCs y la mayoría de los servidores;
      # linux/arm64 porque la VM gratis de Oracle Cloud (Ampere) es ARM y
      # no podría correr una imagen compilada solo para amd64.
      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cachea las capas en el propio GitHub Actions: el primer build
          # tarda varios minutos (compila Go dos veces, una por arquitectura),
          # los siguientes reutilizan lo que no cambió.
          cache-from: type=gha
          cache-to: type=gha,mode=max
