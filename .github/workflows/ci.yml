# CI: corre en cada push y cada Pull Request contra main. Si algún test
# falla, el job queda en rojo y así se ve reflejado en el badge del README
# (https://github.com/<owner>/<repo>/actions/workflows/ci.yml/badge.svg).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # go vet detecta errores de compilación/uso incorrecto del lenguaje
      # que el compilador no chequea (ej. un Printf con argumentos que no
      # coinciden con los verbos de formato). Es gratis correrlo antes de
      # los tests.
      - name: Vet
        run: go vet ./...

      # -race activa el detector de data races (relevante acá porque
      # internal/store usa un cliente Redis compartido entre goroutines).
      # -cover imprime el % de cobertura por paquete al final.
      - name: Test
        run: go test ./... -race -cover
