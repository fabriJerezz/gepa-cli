# Arquitectura: 3 instancias de gepa-cli (app1, app2, app3) sin estado
# propio, todas apuntando a un ÚNICO Redis compartido, detrás de un Nginx
# que reparte la carga entre ellas (round robin, el balanceo por defecto de
# Nginx). Al compartir la misma base de datos, las 3 instancias ven
# exactamente los mismos jugadores/equipos/partidos sin importar a cuál te
# haya enrutado Nginx (identificá cuál te respondió con la cabecera
# X-Instance o el campo "instance" de /health).
#
# Ojo: un único Redis es también un único punto de falla y un cuello de
# botella — no es el patrón de alta disponibilidad de producción (eso
# sería Redis Cluster/Sentinel con réplicas). Ver README, sección
# "Nota sobre el estado: las 3 instancias comparten los mismos datos".

x-app: &app-common
  build: .
  restart: on-failure
  depends_on:
    redis:
      condition: service_healthy

services:
  # --- Base de datos compartida por las 3 instancias -------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Instancia 1 -------------------------------------------------------
  app1:
    <<: *app-common
    environment:
      - REDIS_ADDR=redis:6379
      - INSTANCE_NAME=app1
    # Puerto expuesto solo para poder pegarle directo a esta instancia y
    # comprobar que ahora comparte los mismos datos que las demás. El
    # punto de entrada normal de la app es Nginx (puerto 8080).
    ports:
      - "8081:8080"

  # --- Instancia 2 -------------------------------------------------------
  app2:
    <<: *app-common
    environment:
      - REDIS_ADDR=redis:6379
      - INSTANCE_NAME=app2
    ports:
      - "8082:8080"

  # --- Instancia 3 -------------------------------------------------------
  app3:
    <<: *app-common
    environment:
      - REDIS_ADDR=redis:6379
      - INSTANCE_NAME=app3
    ports:
      - "8083:8080"

  # --- Balanceador de carga -------------------------------------------
  # Único punto de entrada público de la aplicación. Reparte cada request
  # entre app1, app2 y app3 (ver nginx.conf).
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  redis-data:
