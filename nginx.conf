# Configuración de Nginx como balanceador de carga para las 3 instancias
# de gepa-cli.

# "upstream" define el pool de backends. Sin ningún algoritmo explícito
# (least_conn, ip_hash, etc.) Nginx usa round robin: reparte las requests
# una por una, en orden, entre app1 -> app2 -> app3 -> app1 -> ...
# max_fails / fail_timeout definen la tolerancia a fallos:
# si una instancia falla 1 vez, Nginx la marca como caida y deja de
# mandarle trafico durante 10 segundos; pasado ese tiempo la vuelve a
# probar. Son los valores por defecto, pero los escribimos explicitos
# para que la politica quede documentada y no dependa de defaults.
upstream gepa_backend {
    server app1:8080 max_fails=1 fail_timeout=10s;
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://gepa_backend;

        # La otra mitad de la tolerancia a fallos: si la instancia elegida
        # no responde (conexion rechazada, timeout o un 5xx), Nginx
        # reintenta la misma request contra la siguiente del pool, hasta 3
        # intentos. El cliente recibe un 200 normal y nunca se entera de
        # que una instancia estaba caida.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;

        # Cabeceras estándar para que la app vea la IP/host original del
        # cliente en vez de los de Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cabecera de depuración: expone a qué backend (ip:puerto del
        # contenedor) respondió cada request, para poder verificar que el
        # balanceo efectivamente está rotando entre las 3 instancias.
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
