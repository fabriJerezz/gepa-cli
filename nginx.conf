# Configuración de Nginx como balanceador de carga para las 3 instancias
# de gepa-cli.

# "upstream" define el pool de backends. Sin ningún algoritmo explícito
# (least_conn, ip_hash, etc.) Nginx usa round robin: reparte las requests
# una por una, en orden, entre app1 -> app2 -> app3 -> app1 -> ...
upstream gepa_backend {
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://gepa_backend;

        # Cabeceras estándar para que la app vea la IP/host original del
        # cliente en vez de los de Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cabecera de depuración: expone a qué backend (ip:puerto del
        # contenedor) respondió cada request, para poder verificar que el
        # balanceo efectivamente está rotando entre las 3 instancias.
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
